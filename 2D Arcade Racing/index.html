<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Juego de Carreras Pro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="game-wrapper">
    <div class="game-container">
        <div id="startScreen">
            <div class="game-title">🏁 CARRERAS PRO 🏁</div>
            <div class="high-score" id="highScoreDisplay">Mejor puntuación: 0</div>
            <button id="startButton">▶ Iniciar Juego</button>
        </div>

                <div class="pista"></div>
        
        <button id="btnPausa" style="display: none;">⏸</button>

        <div class="puntaje" id="puntaje">Puntos: 0</div>
        <div class="stats">
            <span id="nivel">Nivel: 1</span>
            <span class="vida" id="vidas">❤️❤️❤️</span>
        </div>
        <div class="auto" id="auto"></div>

        <div class="pantalla" id="pantallaPausa">
            <p style="font-size: 36px; text-shadow: 2px 2px 0px #000;">⏸ PAUSA</p>
            <button id="btnReanudar">▶ Reanudar</button>
            <button id="btnSalirMenu" style="background: linear-gradient(145deg, #e74c3c, #c0392b); box-shadow: 0 8px 20px rgba(231, 76, 60, 0.5), 0 6px 0 #902b20;">🏠 Salir al Menú</button>
        </div>

        <div class="pantalla" id="pantallaPerdiste">

            <p>💥 ¡CHOQUE! 💥</p>
            <p id="finalScore"></p>
            <p id="newRecord" style="color: #ffd700; display: none;">¡NUEVO RÉCORD! 🏆</p>
            <button onclick="reiniciarJuego()">🔄 Jugar de nuevo</button>
        </div>

        <div class="pantalla" id="pantallaGanaste">
            <p>🏆 ¡VICTORIA! 🏆</p>
            <p id="finalScoreWin"></p>
            <button onclick="reiniciarJuego()">🔄 Jugar de nuevo</button>
        </div>

        <div class="controles">
            <button id="btnIzquierda">⬅</button>
            <button id="btnDerecha">➡</button>
        </div>
    </div>
</div>

<audio id="gameAudio" loop>
    <source src="audio/audio1.mp3" type="audio/mpeg">
</audio>
<audio id="collisionSound">
    <source src="audio/audio2.mp3" type="audio/mpeg">
</audio>
<audio id="powerupSound">
    <source src="audio/audio3.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
